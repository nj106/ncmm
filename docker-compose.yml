services:
  ncmm:
    image: ghcr.io/3899/ncmm:latest
    container_name: ncmm
    labels:
      - com.centurylinklabs.watchtower.enable=true
    network_mode: bridge
    ports:
      - "3899:3899"
    volumes:
      - ncmm_data:/data
    environment:
      - TZ=Asia/Shanghai
      - NCMM_WEB_SECURE_COOKIE=true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3899/ || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  ncmm_data:
    name: ncmm_data
